[platformio]
default_envs = esp32dev

[common]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=2
lib_deps = 
    WiFi
    ArduinoJson@^7.0.4
    HTTPClient
    SPIFFS
    ESP32-WebServer

[env:esp32dev]
extends = common
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder

[env:test_native]
platform = native
framework = arduino
test_framework = unity
build_flags = 
    -std=c++17
    -DUNIT_TEST
    -DNATIVE_TEST
lib_deps = 
    ${common.lib_deps}
    unity

[env:test_embedded]
extends = common
test_framework = unity
build_flags = 
    ${common.build_flags}
    -DUNIT_TEST
    -DEMBEDDED_TEST
lib_deps = 
    ${common.lib_deps}
    unity

[env:test_coverage]
platform = native
test_framework = unity
build_flags = 
    -std=c++17
    -O0
    --coverage
    -DUNIT_TEST
    -DCOVERAGE_BUILD
    -DNATIVE_TEST
lib_deps = 
    ${common.lib_deps}
    unity
extra_scripts = scripts/coverage.py

[env:production]
extends = common
build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DPRODUCTION_BUILD
    -Os
lib_ldf_mode = deep