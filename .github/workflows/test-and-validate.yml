name: Test and Validate

on:
  push:
    branches: [ main, develop, '*-parking-sensor' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [debug, release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Install dependencies
      run: |
        pio pkg install
    
    - name: Build firmware (${{ matrix.environment }})
      run: |
        if [ "${{ matrix.environment }}" == "debug" ]; then
          pio run -e esp32-s3-devkitc-1-debug
        else
          pio run
        fi
    
    - name: Run unit tests
      run: |
        pio test -e native
    
    - name: Generate test coverage
      run: |
        pio test -e native --coverage
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Firmware size analysis
      run: |
        echo "## Firmware Size Analysis" > size-report.md
        echo "Environment: ${{ matrix.environment }}" >> size-report.md
        echo "" >> size-report.md
        
        if [ -f ".pio/build/esp32-s3-devkitc-1/firmware.bin" ]; then
          FIRMWARE_SIZE=$(stat -c%s ".pio/build/esp32-s3-devkitc-1/firmware.bin")
          echo "Firmware size: ${FIRMWARE_SIZE} bytes" >> size-report.md
          
          # Check against size limits
          MAX_SIZE=1048576  # 1MB limit
          if [ $FIRMWARE_SIZE -gt $MAX_SIZE ]; then
            echo "❌ WARNING: Firmware size exceeds 1MB limit" >> size-report.md
            exit 1
          else
            echo "✅ Firmware size within limits" >> size-report.md
          fi
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: firmware-${{ matrix.environment }}
        path: |
          .pio/build/esp32-s3-devkitc-1/firmware.bin
          .pio/build/esp32-s3-devkitc-1/firmware.elf
          size-report.md

  integration-test:
    runs-on: ubuntu-latest
    needs: build-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download firmware artifacts
      uses: actions/download-artifact@v3
      with:
        name: firmware-release
    
    - name: Validate OTA manifest
      run: |
        # Simulate OTA update process validation
        if [ -f "firmware.bin" ]; then
          SIZE=$(stat -c%s firmware.bin)
          SHA256=$(sha256sum firmware.bin | cut -d' ' -f1)
          
          echo "Firmware validation:"
          echo "Size: $SIZE bytes"
          echo "SHA256: $SHA256"
          
          # Verify minimum requirements
          if [ $SIZE -lt 100000 ]; then
            echo "❌ ERROR: Firmware size too small"
            exit 1
          fi
          
          if [ $SIZE -gt 2000000 ]; then
            echo "❌ ERROR: Firmware size too large for OTA"
            exit 1
          fi
          
          echo "✅ Firmware validation passed"
        fi
